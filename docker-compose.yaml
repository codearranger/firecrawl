name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally,
  # comment out the build: statement and uncomment the image: statement
  # image: ghcr.io/firecrawl/firecrawl
  build: apps/api

  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  networks:
    - backend
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}
  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-8}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-10}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-5}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-5}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}
  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}
  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  # Set NUQ_BACKEND=fdb to run the queue on FoundationDB instead of Postgres
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}
  MAX_CPU: ${MAX_CPU}
  MAX_RAM: ${MAX_RAM}
  # --- Self-hosted open-source replacements for cloud-only features ---
  # Screenshots, actions, mobile and location emulation in playwright-service.
  PLAYWRIGHT_EXTENDED_FEATURES: ${PLAYWRIGHT_EXTENDED_FEATURES:-true}
  # Native (Rust) text extraction for text-based PDFs.
  PDF_RUST_EXTRACT_ENABLE: ${PDF_RUST_EXTRACT_ENABLE:-true}
  # Scanned-PDF and image OCR via ocr-service (fire-pdf compatible API).
  FIRE_PDF_ENABLE: ${FIRE_PDF_ENABLE:-true}
  FIRE_PDF_BASE_URL: ${FIRE_PDF_BASE_URL:-http://ocr-service:3010}
  FIRE_PDF_API_KEY: ${OCR_API_KEY}
  FIRE_PDF_PERCENT: ${FIRE_PDF_PERCENT:-100}
  FIRE_PDF_BY_REFERENCE_ENABLE: ${FIRE_PDF_BY_REFERENCE_ENABLE:-false}
  IMAGE_OCR_ENABLED: ${IMAGE_OCR_ENABLED:-true}
  # /v2/agent via agent-service.
  EXTRACT_V3_BETA_URL: ${EXTRACT_V3_BETA_URL:-http://agent-service:3020}
  AGENT_INTEROP_SECRET: ${AGENT_INTEROP_SECRET}
  # Browser sessions and interact via the self-hosted Hangar (apps/hangar).
  HANGAR_URL: ${HANGAR_URL:-http://hangar:3040}
  # Local Postgres holding only the browser session tables.
  DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@nuq-postgres:5432/${POSTGRES_DB:-postgres}}
  # Tool-capable model for features rerouted from Gemini (interact, query).
  LOCAL_FALLBACK_MODEL_NAME: ${LOCAL_FALLBACK_MODEL_NAME:-ministral-3:14b}
  LOCAL_FALLBACK_REASONING_EFFORT: ${LOCAL_FALLBACK_REASONING_EFFORT:-none}
  # Screenshots/PDFs are stored here and returned as short URLs instead of
  # inline base64 (set SELF_HOSTED_MEDIA_PUBLIC_URL to the API's address).
  SELF_HOSTED_MEDIA_DIR: ${SELF_HOSTED_MEDIA_DIR-/data/media}
  SELF_HOSTED_MEDIA_PUBLIC_URL: ${SELF_HOSTED_MEDIA_PUBLIC_URL:-http://localhost:3002}

services:
  playwright-service:
    restart: unless-stopped
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/playwright-service:latest
    build: apps/playwright-service-ts
    environment:
      PORT: 3000
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      # Configure maximum concurrent pages for Playwright browser instances
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-10}
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Resource limits for Docker Compose (not Swarm)
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  api:
    restart: unless-stopped
    <<: *common-service
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}
      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}
      ENV: local
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # Only the pg backend uses nuq-postgres, so an unhealthy Postgres must not
      # block startup when NUQ_BACKEND=fdb.
      nuq-postgres:
        condition: service_healthy
        required: false
    ports:
      - "${PORT:-3002}:${INTERNAL_PORT:-3002}"
    volumes:
      - fdb-cluster-file:/var/fdb:ro
      - media:/data/media
    command: node dist/src/harness.js --start-docker
    # Resource limits for Docker Compose (not Swarm)
    # Increase if you have more CPU cores/RAM available
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  redis:
    restart: unless-stopped
    # NOTE: If you want to use Valkey (open source) instead of Redis (source available),
    # uncomment the Valkey statement and comment out the Redis statement.
    # Using Valkey with Firecrawl is untested and not guaranteed to work. Use with caution.
    image: redis:alpine
    # image: valkey/valkey:alpine

    networks:
      - backend
    volumes:
      - redis:/data
    command: redis-server --bind 0.0.0.0 --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  rabbitmq:
    restart: unless-stopped
    image: rabbitmq:3-management
    networks:
      - backend
    command: rabbitmq-server
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 180s
      start_interval: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"

  nuq-postgres:
    restart: unless-stopped
    # NOTE: If you don't want to build the image locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/nuq-postgres:latest
    build: apps/nuq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # FoundationDB queue backend (experimental). Enable by setting
  # NUQ_BACKEND=fdb; the api container reads the shared cluster file from the
  # fdb-cluster-file volume. Replaces nuq-postgres once stable.
  foundationdb:
    # Only started with `--profile fdb` (NUQ_BACKEND=fdb).
    profiles: ["fdb"]
    image: foundationdb/foundationdb:7.3.63
    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500
    networks:
      - backend
    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # one-shot: creates the database on first boot (no-op afterwards)
  foundationdb-init:
    profiles: ["fdb"]
    image: foundationdb/foundationdb:7.3.63
    depends_on:
      - foundationdb
    entrypoint:
      - /bin/bash
      - -c
      - "sleep 5 && out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1); status=$$?; printf '%s\n' \"$$out\"; if [ \"$$status\" -eq 0 ]; then exit 0; fi; printf '%s\n' \"$$out\" | grep -Eiq 'already.*configured|database.*configured|database.*already exists'"
    volumes:
      - fdb-cluster-file:/var/fdb
    networks:
      - backend
    restart: "no"

  # OCR for scanned PDFs and images (apps/ocr-service). Uses a vision model on
  # Ollama by default; set OCR_BACKEND=mineru + MINERU_URL to use MinerU.
  ocr-service:
    restart: unless-stopped
    build: apps/ocr-service
    environment:
      OCR_BACKEND: ${OCR_BACKEND:-ollama}
      OLLAMA_URL: ${OCR_OLLAMA_URL:-http://host.docker.internal:11434}
      OCR_MODEL: ${OCR_MODEL:-qwen2.5vl:7b}
      OCR_CONCURRENCY: ${OCR_CONCURRENCY:-2}
      MINERU_URL: ${MINERU_URL}
      OCR_API_KEY: ${OCR_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Backend for /v2/agent (apps/agent-service): tool-calling research loop on
  # a local OpenAI-compatible model, using this API's search and scrape.
  agent-service:
    restart: unless-stopped
    build: apps/agent-service
    environment:
      AGENT_INTEROP_SECRET: ${AGENT_INTEROP_SECRET}
      FIRECRAWL_API_URL: http://api:3002
      LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-${OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}}
      LLM_API_KEY: ${OPENAI_API_KEY:-ollama}
      AGENT_MODEL: ${AGENT_MODEL:-ministral-3:14b}
      AGENT_REASONING_EFFORT: ${AGENT_REASONING_EFFORT:-none}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-12}
      SELF_HOSTED_WEBHOOK_HMAC_SECRET: ${SELF_HOSTED_WEBHOOK_HMAC_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3020/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # ---------------------------------------------------------------------------
  # Hangar: browser sessions (/v2/browser) and interact, each session in its
  # own sandbox container. See SELF_HOST_OSS_FEATURES.md.
  # ---------------------------------------------------------------------------
  hangar:
    restart: unless-stopped
    build: apps/hangar/controller
    environment:
      DOCKER_HOST: tcp://hangar-docker-proxy:2375
      SANDBOX_IMAGE: firecrawl-hangar-sandbox
      SANDBOX_NETWORK: ${HANGAR_SANDBOX_NETWORK:-hangar-sandbox}
      SANDBOX_SUBNET: ${HANGAR_SANDBOX_SUBNET:-10.250.250.0/24}
      DATA_VOLUME: ${HANGAR_DATA_VOLUME:-hangar-data}
      EGRESS_PROXY: http://hangar-egress:3128
      PUBLIC_URL: ${HANGAR_PUBLIC_URL:-http://localhost:3030}
      MAX_SESSIONS: ${HANGAR_MAX_SESSIONS:-4}
      SANDBOX_MEMORY_MB: ${HANGAR_SANDBOX_MEMORY_MB:-2048}
      SANDBOX_CPUS: ${HANGAR_SANDBOX_CPUS:-1.5}
      SANDBOX_RUNTIME: ${HANGAR_SANDBOX_RUNTIME}
    ports:
      # Public gateway only (CDP, live view, recordings; per-session tokens).
      # The internal API (3040) stays on the Docker network.
      - "${HANGAR_PUBLIC_PORT:-3030}:3030"
    volumes:
      - hangar-data:/data
    networks:
      - backend
      - hangar-sandbox
      - hangar-control
    depends_on:
      - hangar-docker-proxy
      - hangar-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # The only path from sandboxes to the internet; refuses private targets.
  hangar-egress:
    restart: unless-stopped
    build: apps/hangar/egress
    environment:
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
    networks:
      - backend
      - hangar-sandbox
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

  # Restricted Docker API for the controller: container endpoints only.
  hangar-docker-proxy:
    restart: unless-stopped
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 0
      IMAGES: 0
      NETWORKS: 0
      VOLUMES: 0
      EXEC: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - hangar-control

  # Builds the per-session sandbox image (not a running service):
  #   docker compose --profile build build hangar-sandbox
  hangar-sandbox:
    profiles: ["build"]
    build: apps/hangar/sandbox
    image: firecrawl-hangar-sandbox

  # One-shot: creates the browser session tables in nuq-postgres.
  hangar-db-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      nuq-postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./apps/hangar/sessions-db.sql:/sessions-db.sql:ro
    command:
      - psql
      - -h
      - nuq-postgres
      - -U
      - ${POSTGRES_USER:-postgres}
      - -d
      - ${POSTGRES_DB:-postgres}
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sessions-db.sql
    networks:
      - backend

  # Ingestion UI. Upstream removed apps/ui in 2026 (#5012); this keeps the
  # previously built image running.
  ui:
    restart: unless-stopped
    image: firecrawl-ui
    pull_policy: never
    ports:
      - "3081:3000"
    environment:
      - FIRECRAWL_API_URL=http://api:3002
    depends_on:
      - api
    networks:
      - backend

  mcp-server:
    build:
      context: https://github.com/mendableai/firecrawl-mcp-server.git
      dockerfile: Dockerfile
    ports:
      - "3003:3000"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - FIRECRAWL_API_URL=${FIRECRAWL_API_URL:-http://api:3002}
      - HOST=0.0.0.0
      - PORT=3000
      - SSE_LOCAL=true
      - SSE_HOST=0.0.0.0
    command: ["node", "dist/server.js", "--http"]
    restart: unless-stopped
    depends_on:
      - redis
      - api
    networks:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    restart: unless-stopped
    env_file:
      - path: .env.tunnel
        required: false
    expose:
      - 20241/tcp
    environment:
      - TUNNEL_METRICS=0.0.0.0:20241
    command: tunnel --no-autoupdate run
    depends_on:
      - api
    networks:
      - backend
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  backend:
    driver: bridge
  # Sandboxes only: no route out except through hangar-egress.
  hangar-sandbox:
    name: ${HANGAR_SANDBOX_NETWORK:-hangar-sandbox}
    internal: true
    ipam:
      config:
        - subnet: ${HANGAR_SANDBOX_SUBNET:-10.250.250.0/24}
  hangar-control:
    internal: true

volumes:
  media:
  hangar-data:
    name: ${HANGAR_DATA_VOLUME:-hangar-data}
  redis:
  fdb-data:
  fdb-cluster-file:
